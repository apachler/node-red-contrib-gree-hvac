<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gree HVAC Simulator">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1d2434"/>
            <stop offset="1" stop-color="#11141d"/>
        </linearGradient>
        <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#232c40"/>
            <stop offset="1" stop-color="#161b28"/>
        </linearGradient>
    </defs>

    <!-- rounded app-icon background -->
    <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bg)" stroke="#2a3550" stroke-width="1.5"/>

    <!-- signal arcs: the Gree UDP protocol / wireless control + simulation -->
    <g fill="none" stroke="#4cc9f0" stroke-width="2.6" stroke-linecap="round">
        <path d="M19 28 Q 32 16.5 45 28" opacity="0.32"/>
        <path d="M23 27 Q 32 19 41 27" opacity="0.6"/>
        <path d="M27 26 Q 32 21.5 37 26" opacity="1"/>
    </g>

    <!-- AC indoor unit -->
    <rect x="11" y="32" width="42" height="18" rx="4.5" fill="url(#unit)" stroke="#4cc9f0" stroke-width="2"/>

    <!-- louvers / airflow -->
    <g stroke="#86ddf5" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <line x1="16" y1="39.5" x2="40" y2="39.5"/>
        <line x1="16" y1="44.5" x2="35" y2="44.5"/>
    </g>

    <!-- "online" status LED -->
    <circle cx="46.5" cy="44.5" r="2.1" fill="#2dd47a"/>
    <circle cx="46.5" cy="44.5" r="2.1" fill="none" stroke="#2dd47a" stroke-width="2" opacity="0.35"/>
</svg>
