name: Docs media

# Renders the README's demo GIF (VHS) and dashboard screenshots (Playwright).
# Manual only — heavy, and only needed when the demo/dashboard changes.
# VHS doesn't render reliably on all dev hosts, so CI is the source of truth
# for the demo GIF. Both the GIF and the screenshots are uploaded as artifacts:
# master is protected by a ruleset (PR + required checks) that GITHUB_TOKEN
# can't bypass, so commit a new GIF through a normal PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: Render demo GIF + screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install repo deps
        run: npm ci

      - name: Build images
        run: docker compose build

      - name: Render demo GIF (VHS)
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/demo.tape

      - name: Bring stack up for screenshots
        run: |
          npm run sim:up
          # wait for the sim dashboard to answer
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/state >/dev/null && break
            sleep 2
          done

      - name: Capture dashboard screenshots (Playwright)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node docs/screenshot.mjs

      - name: Tear down
        if: always()
        run: npm run sim:down || true

      - name: Upload demo GIF + screenshots (review, not auto-committed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-media
          path: |
            docs/demo.gif
            docs/nodered-home.png
            docs/nodered-config.png
            docs/nodered-sim-sensors.png
            docs/sim-dashboard.png
          if-no-files-found: warn
