name: Release

on:
  push:
    branches:
      - master

# semantic-release pushes the release commit + tag, creates the GitHub Release
# (with the packed .tgz asset), and comments on released issues/PRs. No npm
# publish — this package ships via Git + GitHub Releases only (same model as
# the gree-hvac-client fork it depends on).
#
# Runs as the repo owner via RELEASE_TOKEN when it is set (a fine-grained PAT
# with Contents, Issues and Pull requests read/write on this repo, stored as a
# `release` environment secret), same as gree-hvac-client: the built-in
# GITHUB_TOKEN can't bypass a master ruleset on a user-owned repo. Until the
# secret exists it falls back to GITHUB_TOKEN, which needs the write scopes
# below; drop them to `contents: read` once RELEASE_TOKEN is in place.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
