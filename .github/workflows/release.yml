name: Release

on:
  push:
    branches:
      - master

# semantic-release pushes the release commit + tag, creates the GitHub Release
# (with the packed .tgz asset), and comments on released issues/PRs. No npm
# publish — this package ships via Git + GitHub Releases only (same model as
# the gree-hvac-client fork it depends on).
#
# All of that runs as the repo owner via RELEASE_TOKEN (a fine-grained PAT
# with Contents, Issues and Pull requests read/write on this repo, stored as a
# `release` environment secret), same as gree-hvac-client. The built-in
# GITHUB_TOKEN can't bypass the master ruleset (PR + required checks) on a
# user-owned repo; the owner's admin role can. So the job's own token only
# needs to read.
permissions:
  contents: read

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    # Only the provenance step needs more than read: an OIDC token to sign the
    # attestation and permission to store it. Pushes still go via RELEASE_TOKEN.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is missing from the 'release' environment"
            exit 1
          fi
      # Credentials stay persisted on purpose: semantic-release pushes the
      # release commit + tag through this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # semantic-release only packs pack/*.tgz when it cut a release.
      - name: Detect new release
        id: rel
        run: |
          if ls pack/*.tgz >/dev/null 2>&1; then
            echo "tag=$(git describe --tags --exact-match)" >> "$GITHUB_OUTPUT"
          fi
      # Signed SLSA build provenance for the tarball (verify with
      # `gh attestation verify <file>.tgz -R apachler/node-red-contrib-gree-hvac`).
      - name: Attest build provenance
        id: attest
        if: steps.rel.outputs.tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pack/*.tgz
      # The provenance bundle (for offline `gh attestation verify --bundle`)
      # and a CycloneDX SBOM of the runtime dependency tree, attached to the
      # release. --clobber keeps a re-run of the job idempotent.
      - name: Attach provenance and SBOM to the release
        if: steps.rel.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          name="node-red-contrib-gree-hvac-${TAG#v}"
          cp "$BUNDLE" "pack/$name.tgz.sigstore.json"
          npm sbom --omit=dev --sbom-format cyclonedx > "pack/$name.cdx.json"
          gh release upload "$TAG" --clobber "pack/$name.tgz.sigstore.json" "pack/$name.cdx.json"
