name: E2E

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-unit:
    name: Simulator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install repo deps (for gree-hvac-client in roundtrip test)
        run: npm ci
      - name: Run sim unit tests
        run: npm run test:sim

  e2e:
    name: Docker compose e2e
    runs-on: ubuntu-latest
    needs: sim-unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install repo deps (gree-hvac-client + dev tools for tests)
        run: npm ci
      - name: Build and run e2e
        run: npm run test:e2e
        env:
          # GitHub runners have docker compose v2 built in
          E2E_SKIP_BUILD: "0"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=500 || true
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: sim-unit
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      # Report pass: every severity goes to code scanning (the action ignores
      # `severity` for SARIF output unless limit-severities-for-sarif is set,
      # so we don't pretend to filter here). Never fails the job.
      - name: Scan gree-hvac-sim image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-sim:dev
          format: sarif
          output: trivy-sim.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan gree-hvac-nodered image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-nodered:dev
          format: sarif
          output: trivy-nodered.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF (gree-sim)
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-sim.sarif
          category: trivy-gree-sim
      - name: Upload Trivy SARIF (node-red)
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-nodered.sarif
          category: trivy-nodered
      # Gate pass: fail on fixable HIGH/CRITICAL findings. Runs after the
      # uploads so code scanning is updated even when the gate trips.
      - name: Gate gree-hvac-sim image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-sim:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Gate gree-hvac-nodered image (HIGH/CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-nodered:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
