name: E2E

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-unit:
    name: Simulator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "18.x"
          cache: "npm"
      - name: Install repo deps (for gree-hvac-client in roundtrip test)
        run: npm ci
      - name: Run sim unit tests
        run: npm run test:sim

  e2e:
    name: Docker compose e2e
    runs-on: ubuntu-latest
    needs: sim-unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "18.x"
          cache: "npm"
      - name: Install repo deps (gree-hvac-client + dev tools for tests)
        run: npm ci
      - name: Build and run e2e
        run: npm run test:e2e
        env:
          # GitHub runners have docker compose v2 built in
          E2E_SKIP_BUILD: "0"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=500 || true
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  image-scan:
    name: Trivy image scan (report-only)
    runs-on: ubuntu-latest
    needs: sim-unit
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Scan gree-hvac-sim image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-sim:dev
          format: sarif
          output: trivy-sim.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only for now: never fail the pipeline. Tighten to a
          # non-zero exit-code once the baseline is clean (backlog #2).
          exit-code: "0"
      - name: Scan gree-hvac-nodered image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gree-hvac-nodered:dev
          format: sarif
          output: trivy-nodered.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF (gree-sim)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sim.sarif
          category: trivy-gree-sim
      - name: Upload Trivy SARIF (node-red)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-nodered.sarif
          category: trivy-nodered
