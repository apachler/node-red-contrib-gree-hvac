name: E2E

on:
  pull_request:
  push:
    branches:
      - master
  # Nightly: the Trivy gate (image-scan) runs here for real and files an
  # issue, so upstream base-image CVEs don't block unrelated PRs.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-unit:
    name: Simulator unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install repo deps (for gree-hvac-client in roundtrip test)
        run: npm ci --ignore-scripts
      - name: Run sim unit tests
        run: npm run test:sim

  e2e:
    name: Docker compose e2e
    runs-on: ubuntu-latest
    needs: sim-unit
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install repo deps (gree-hvac-client + dev tools for tests)
        run: npm ci --ignore-scripts
      - name: Build and run e2e
        run: npm run test:e2e
        env:
          # GitHub runners have docker compose v2 built in
          E2E_SKIP_BUILD: "0"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=500 || true
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: sim-unit
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      issues: write
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Where the HIGH/CRITICAL gate may fail the job: on PRs that change the
      # images (Dockerfiles, sim, compose), and on the nightly/manual run.
      # Elsewhere it only reports: findings in the upstream base images must
      # not block unrelated PRs or turn master red. Dependency CVEs in the
      # package itself are gated by the CI "Dependency audit" job.
      - name: Decide whether the gate is enforced
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) enforce=true ;;
            pull_request)
              # a failing API call fails the step rather than skipping the gate
              files=$(gh pr diff "$PR_NUMBER" -R "$REPO" --name-only)
              if printf '%s\n' "$files" \
                  | grep -qE '^(docker/|sim/|docker-compose[^/]*\.ya?ml$|\.dockerignore$)'; then
                enforce=true
              else
                enforce=false
              fi ;;
            *) enforce=false ;;
          esac
          echo "enforce=$enforce" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT enforce=$enforce"
      - name: Build images
        run: docker compose build
      # Report pass: every severity goes to code scanning (the action ignores
      # `severity` for SARIF output unless limit-severities-for-sarif is set,
      # so we don't pretend to filter here). Never fails the job.
      - name: Scan gree-hvac-sim image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gree-hvac-sim:dev
          format: sarif
          output: trivy-sim.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan gree-hvac-nodered image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gree-hvac-nodered:dev
          format: sarif
          output: trivy-nodered.sarif
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF (gree-sim)
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-sim.sarif
          category: trivy-gree-sim
      - name: Upload Trivy SARIF (node-red)
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-nodered.sarif
          category: trivy-nodered
      # Gate pass: fixable HIGH/CRITICAL findings. Runs after the uploads so
      # code scanning is updated even when the gate trips; fails the job only
      # where steps.scope enforces it.
      - name: Gate gree-hvac-sim image (HIGH/CRITICAL)
        id: gate-sim
        continue-on-error: ${{ steps.scope.outputs.enforce != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gree-hvac-sim:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Gate gree-hvac-nodered image (HIGH/CRITICAL)
        id: gate-nodered
        if: always()
        continue-on-error: ${{ steps.scope.outputs.enforce != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gree-hvac-nodered:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Nightly/manual: keep one tracking issue in sync with the gate result.
      - name: Open, update or close the Trivy tracking issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIM: ${{ steps.gate-sim.outcome }}
          NODERED: ${{ steps.gate-nodered.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Trivy: fixable HIGH/CRITICAL findings in the dev images"
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ "$SIM" = "failure" ] || [ "$NODERED" = "failure" ]; then
            {
              echo "The nightly image scan found fixable HIGH/CRITICAL vulnerabilities: $RUN_URL"
              echo
              for f in trivy-sim.sarif trivy-nodered.sarif; do
                [ -f "$f" ] || continue
                echo "**$f**"
                jq -r '.runs[].tool.driver.rules[]
                  | select((.properties["security-severity"] // "0" | tonumber) >= 7)
                  | "- \(.id): \(.shortDescription.text)"' "$f" | sort -u
                echo
              done
              echo "Usually a base-image dependency: bump the image (Dependabot docker PR) or add an override in docker/nodered/Dockerfile."
            } > body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "$REPO" --body-file body.md
            else
              gh issue create -R "$REPO" --title "$title" --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" -R "$REPO" --comment "Nightly scan is clean again: $RUN_URL"
          fi
