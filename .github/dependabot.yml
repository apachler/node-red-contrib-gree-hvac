version: 2
updates:
  # All npm (dev) updates batched into one monthly PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let new releases age a few days before proposing them (security
    # updates skip this), so a compromised publish is likely pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  # All GitHub Actions bumps batched into one monthly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let new releases age a few days before proposing them (security
    # updates skip this), so a compromised publish is likely pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the digest-pinned base images current, batched weekly: base-image
  # patches are the main source of Trivy findings, so monthly lags too far.
  - package-ecosystem: "docker"
    directories:
      - "/sim"
      - "/docker/nodered"
    schedule:
      interval: "weekly"
    # Let new releases age a few days before proposing them (security
    # updates skip this), so a compromised publish is likely pulled first.
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"
