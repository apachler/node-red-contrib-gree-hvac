version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # Keep the digest-pinned base images current.
  - package-ecosystem: "docker"
    directories:
      - "/sim"
      - "/docker/nodered"
    schedule:
      interval: "weekly"
