<script type="text/x-red" data-help-name="gree-hvac">
    <p>Controls a Gree HVAC (air conditioner) over its local WiFi protocol.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Map of property names to values to set in a single request (e.g. <code>{ power: "on", temperature: 22 }</code>).</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dt>payload <span class="property-type">string | number</span></dt>
        <dd>Alternative form: set a single property where <code>msg.topic</code> is the property name.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li><b>Changes</b> — <code>topic</code> is <code>updated</code> (delta from device) or <code>acknowledged</code> (delta from a write).</li>
        <li><b>Snapshot</b> — <code>topic</code> is <code>properties</code>, the full current property map.</li>
        <li><b>Diagnostics</b> — structured events (<code>state</code>, <code>error</code>, <code>queue_overflow</code>, <code>heartbeat</code>, <code>update</code>, <code>write_ack</code>) with metrics for alerting and dashboards.</li>
    </ol>

    <h3>Catch-node integration</h3>
    <p>Invalid input messages and rejected writes (when <em>reject if offline</em> is enabled) call <code>node.error(err, msg)</code> so they can be handled by a downstream catch node.</p>

    <h3>Validation</h3>
    <p>When enabled (default), property names and enum-valued payloads are checked against the upstream <code>PROPERTY</code> / <code>VALUE</code> schema. Unknown keys are dropped with a warning rather than sent to the device, because unknown keys are one of the known triggers for a wedged WiFi module.</p>

    <h3>Connection handling</h3>
    <p>The node wraps the underlying client with an exponential-backoff reconnect strategy and two watchdogs (one for silence while connected, one for "stuck in connecting"). Defaults are tuned for unattended 24/7 operation over WiFi.</p>
    <ul>
        <li><b>Polling interval / timeout / no-response threshold</b>: how often the device is polled, how long a single poll may take, and how many consecutive misses trigger a full client teardown + fresh socket. This is what recovers a stuck WiFi module without a power-cycle.</li>
        <li><b>Watchdog silence</b>: total silence while connected before a hard reset is forced.</li>
        <li><b>Stuck-connecting cap</b>: maximum time the node may sit in the <code>connecting</code> state before a hard reset is forced.</li>
        <li><b>Recovery delay / max backoff</b>: initial reconnect delay and the ceiling of the exponential backoff. A long initial delay gives the WiFi module time to recover instead of being flooded with scan/bind packets.</li>
        <li><b>Min command spacing / max queued writes</b>: rate-limit + bounded coalescing queue for outbound writes. Multiple updates to the same property collapse to the latest value before being sent; when the queue grows past the cap, the oldest entries are evicted.</li>
        <li><b>Heartbeat interval</b>: emits a periodic <code>heartbeat</code> diagnostic on output 3 so absence-of-message can drive offline alerts. Set to 0 to disable.</li>
    </ul>

    <h3>Runtime context</h3>
    <p>The node publishes a live metrics snapshot under <code>context().get('gree')</code> with the current state, uptime, last-contact timestamp, queue size, and reset counters.</p>
</script>
