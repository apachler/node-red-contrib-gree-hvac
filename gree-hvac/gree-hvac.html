<script type="text/x-red" data-help-name="gree-hvac">
    <p>Controls a Gree HVAC (air conditioner) over its local WiFi protocol.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Map of property names to values to set in a single request (e.g. <code>{ power: "on", temperature: 22 }</code>).</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dt>payload <span class="property-type">string | number</span></dt>
        <dd>Alternative form: set a single property where <code>msg.topic</code> is the property name.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Change events: <code>topic</code> is <code>updated</code> (from device) or <code>acknowledged</code> (from a write).</li>
        <li>Full current property snapshot: <code>topic</code> is <code>properties</code>.</li>
    </ol>

    <h3>Connection handling</h3>
    <p>The node wraps the underlying client with an exponential-backoff reconnect strategy
    and a watchdog. The defaults are tuned for unattended 24/7 operation over WiFi:</p>
    <ul>
        <li><b>Polling interval / timeout</b>: how often device status is polled and how long a single poll may take. A timeout of roughly <em>2 × interval</em> is recommended for WiFi.</li>
        <li><b>No-response threshold</b>: after this many consecutive missed polls the client is fully torn down and rebuilt (new UDP socket, new keys). This is what recovers a stuck WiFi module without a power-cycle.</li>
        <li><b>Watchdog silence</b>: if no message of any kind has been seen from the device for this long, the same hard reset is triggered.</li>
        <li><b>Recovery delay / max backoff</b>: wait time before the first reconnect attempt and the ceiling for the exponential backoff. The long initial delay (default 30 s) gives the WiFi module time to recover instead of being flooded with scan/bind packets.</li>
        <li><b>Min command spacing</b>: minimum time between two outbound writes. Bursts are coalesced — multiple updates to the same property collapse to the latest value before being sent.</li>
    </ul>
</script>
