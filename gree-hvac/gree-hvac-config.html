<script type="text/javascript">
    RED.nodes.registerType('gree-hvac-config', {
        category: 'config',
        defaults: {
            name: { value: "", required: true, validate: RED.validators.regex(/^[a-zA-Z0-9-_\s]+$/) },
            host: {
                value: "",
                required: false,
                // Host is optional only when resolve-by-MAC is on and a MAC is set.
                validate: function (v) {
                    if (v) return true;
                    return this.resolveByMac === true && !!(this.mac || '').trim();
                }
            },
            port: { value: 7000, required: false, validate: RED.validators.number() },
            resolveByMac: { value: false },
            mac: {
                value: "",
                required: false,
                validate: function (v) {
                    if (this.resolveByMac !== true) return true;
                    return /^[0-9a-fA-F]{12}$/.test(String(v || '').replace(/[^0-9a-fA-F]/g, ''));
                }
            },
            broadcastAddress: { value: "255.255.255.255", required: false },
            subUnit: {
                value: "",
                required: false,
                validate: function (v) {
                    return !v || /^[0-9a-fA-F:-]{6,}$/.test(String(v).trim());
                }
            },
            halfDegree: { value: false },
            encodedTargetHumidity: { value: false },
            statusBatchSize: { value: 20, required: false, validate: RED.validators.number() }
        },
        label: function () {
            return this.name;
        },
        oneditprepare: function () {
            const toggle = function () {
                const on = $("#node-config-input-resolveByMac").is(":checked");
                $(".gree-mac-row").toggle(on);
            };
            $("#node-config-input-resolveByMac").on("change", toggle);
            toggle();
        }
    });
</script>

<script type="text/x-red" data-template-name="gree-hvac-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-globe"></i> IP Address</label>
        <input type="text" id="node-config-input-host" placeholder="192.168.xx.xx">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-plug"></i> UDP port</label>
        <input type="number" id="node-config-input-port" min="1" max="65535" step="1" placeholder="7000" style="width:100px">
    </div>
    <hr/>
    <div class="form-row">
        <label for="node-config-input-resolveByMac" style="width:auto"><i class="fa fa-random"></i> Resolve by MAC</label>
        <input type="checkbox" id="node-config-input-resolveByMac" style="display:inline-block; width:auto; vertical-align:top">
    </div>
    <div class="form-tips gree-mac-row" style="margin-bottom:8px">
        Finds the device by its MAC/cid with a broadcast scan and follows it when
        its IP changes (DHCP): once it stops answering, the next scan finds it at
        its new address. The IP Address above is not used then.
    </div>
    <div class="form-row gree-mac-row">
        <label for="node-config-input-mac"><i class="fa fa-id-card-o"></i> Device MAC</label>
        <input type="text" id="node-config-input-mac" placeholder="aabbccddeeff (cid from discovery)">
    </div>
    <div class="form-row gree-mac-row">
        <label for="node-config-input-broadcastAddress"><i class="fa fa-bullhorn"></i> Broadcast</label>
        <input type="text" id="node-config-input-broadcastAddress" placeholder="255.255.255.255">
    </div>
    <hr/>
    <h4>Unit</h4>
    <div class="form-row">
        <label for="node-config-input-subUnit"><i class="fa fa-sitemap"></i> Indoor unit</label>
        <input type="text" id="node-config-input-subUnit" placeholder="multi-split only: indoor unit MAC">
    </div>
    <div class="form-tips" style="margin-bottom:8px">
        Multi-split systems: the IP / MAC above address the outdoor unit's WiFi
        module; enter the indoor unit's MAC here (list them with the
        <code>getSubUnits</code> action), one config node per indoor unit.
        Leave blank for a single unit.
    </div>
    <div class="form-row">
        <label for="node-config-input-halfDegree" style="width:auto">
            <input type="checkbox" id="node-config-input-halfDegree" style="width:auto; margin-right:6px">
            Half-degree °C setpoints (firmwares with <code>Add0.5</code>)
        </label>
    </div>
    <div class="form-row">
        <label for="node-config-input-encodedTargetHumidity" style="width:auto">
            <input type="checkbox" id="node-config-input-encodedTargetHumidity" style="width:auto; margin-right:6px">
            Encoded target humidity (ACs with humidity control, e.g. Airy Pro)
        </label>
    </div>
    <div class="form-row">
        <label for="node-config-input-statusBatchSize"><i class="fa fa-list"></i> Status batch</label>
        <input type="number" id="node-config-input-statusBatchSize" min="1" max="50" step="1" placeholder="20" style="width:100px">
        <span style="margin-left:6px">codes per status request</span>
    </div>
</script>

<script type="text/x-red" data-help-name="gree-hvac-config">
    <p>One Gree HVAC unit: its address and the firmware options of the unit.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>IP Address / UDP port</dt>
        <dd>The unit's address (port 7000). Optional when <b>Resolve by MAC</b> is on.</dd>
        <dt>Resolve by MAC</dt>
        <dd>Scans the <b>Broadcast</b> address for the unit with this MAC (<code>cid</code>) and binds only to it. After a DHCP address change the unit stops answering; after <em>no-response threshold</em> missed polls (plus the recovery delay) the next scan finds it at its new address. The IP Address is not used then.</dd>
        <dt>Indoor unit</dt>
        <dd>Multi-split systems only: the indoor unit's MAC. The address above is then the outdoor unit's WiFi module, which relays status and commands. Get the MACs with the <code>getSubUnits</code> action of a <code>gree-hvac</code> node pointed at the outdoor unit.</dd>
        <dt>Half-degree °C setpoints</dt>
        <dd>For firmwares that carry the half degree in <code>Add0.5</code>: <code>temperature</code> may then be e.g. <code>23.5</code>. Leave off unless the unit shows half degrees.</dd>
        <dt>Encoded target humidity</dt>
        <dd>Air conditioners with humidity control (e.g. Airy Pro) encode <code>targetHumidity</code> as (% − 15) / 5. Leave off for dehumidifiers.</dd>
        <dt>Status batch</dt>
        <dd>Most vendor codes per status request (20); some firmwares stop answering above ~29.</dd>
    </dl>
</script>
