<script type="text/javascript">
    RED.nodes.registerType('gree-hvac-discover', {
        category: 'devices',
        color: '#98cecf',
        defaults: {
            name: { value: "Gree discover" },
            broadcastAddress: { value: "255.255.255.255" },
            port: { value: 7000, validate: RED.validators.number() },
            listenWindowMs: { value: 3000, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: "gree.png",
        label: function () {
            return this.name || "Gree discover";
        }
    });
</script>

<script type="text/x-red" data-template-name="gree-hvac-discover">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-broadcastAddress"><i class="fa fa-globe"></i> Broadcast address</label>
        <input type="text" id="node-input-broadcastAddress" placeholder="255.255.255.255">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> UDP port</label>
        <input type="number" id="node-input-port" min="1" max="65535" style="width:100px">
    </div>
    <div class="form-row">
        <label for="node-input-listenWindowMs"><i class="icon-tag"></i> Listen window (ms)</label>
        <input type="number" id="node-input-listenWindowMs" min="500" max="30000" step="100" style="width:120px">
    </div>
</script>

<script type="text/x-red" data-help-name="gree-hvac-discover">
    <p>Broadcast-scans the local subnet for Gree HVAC devices and emits the list as <code>msg.payload</code>.</p>

    <h3>Inputs</h3>
    <p>Any input message triggers a scan. The following <code>msg</code> properties override the node config for that scan:</p>
    <dl class="message-properties">
        <dt class="optional">broadcastAddress <span class="property-type">string</span></dt>
        <dt class="optional">port <span class="property-type">number</span></dt>
        <dt class="optional">windowMs <span class="property-type">number</span></dt>
        <dt class="optional">action <span class="property-type">string</span></dt>
        <dd><code>discover</code> (default) or <code>configureWifi</code> (see <em>WiFi setup</em>).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>One entry per device that answered inside the listen window: <code>{ mac, cid, name, address, port, version, subUnits, pack }</code>. <code>mac</code> (also as <code>cid</code>) is the device id for <em>Resolve by MAC</em>, <code>address</code> its IP, <code>version</code> the WiFi module version, <code>subUnits</code> the number of indoor units when it is the outdoor unit of a multi-split system (else 0), and <code>pack</code> the full decrypted scan answer (brand, model, ...).</dd>
    </dl>

    <h3>WiFi setup</h3>
    <p>With <code>msg.action</code> = <code>"configureWifi"</code> and <code>msg.payload</code> = <code>{ ssid, password }</code> the node joins a unit in AP (setup) mode to your WiFi network instead of scanning. Reset the unit's WiFi first (MODE + WIFI, or MODE + TURBO, on the remote for 5 s) and connect the Node-RED host to the unit's own WiFi network (named after the last digits of its MAC, password usually <code>12345678</code>); the unit is then at <code>192.168.1.1</code> (override with <code>payload.host</code>). Some firmwares take passwords of at most 31 characters. The answer is <code>{ confirmed, mac }</code> with <code>topic</code> <code>gree-wifi-setup</code>; <code>confirmed</code> is false when the unit sent no confirmation, which some firmwares never do. The password is not passed on.</p>

    <h3>Notes</h3>
    <p>Use the <code>address</code> and <code>mac</code> to configure a <code>gree-hvac-config</code> node.</p>
</script>
