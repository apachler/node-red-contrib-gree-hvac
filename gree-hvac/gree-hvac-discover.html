<script type="text/javascript">
    RED.nodes.registerType('gree-hvac-discover', {
        category: 'devices',
        color: '#98cecf',
        defaults: {
            name: { value: "Gree discover" },
            broadcastAddress: { value: "255.255.255.255" },
            port: { value: 7000, validate: RED.validators.number() },
            listenWindowMs: { value: 3000, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: "gree.png",
        label: function () {
            return this.name || "Gree discover";
        }
    });
</script>

<script type="text/x-red" data-template-name="gree-hvac-discover">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-broadcastAddress"><i class="fa fa-globe"></i> Broadcast address</label>
        <input type="text" id="node-input-broadcastAddress" placeholder="255.255.255.255">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> UDP port</label>
        <input type="number" id="node-input-port" min="1" max="65535" style="width:100px">
    </div>
    <div class="form-row">
        <label for="node-input-listenWindowMs"><i class="icon-tag"></i> Listen window (ms)</label>
        <input type="number" id="node-input-listenWindowMs" min="500" max="30000" step="100" style="width:120px">
    </div>
</script>

<script type="text/x-red" data-help-name="gree-hvac-discover">
    <p>Broadcast-scans the local subnet for Gree HVAC devices and emits the list as <code>msg.payload</code>.</p>

    <h3>Inputs</h3>
    <p>Any input message triggers a scan. The following <code>msg</code> properties override the node config for that scan:</p>
    <dl class="message-properties">
        <dt class="optional">broadcastAddress <span class="property-type">string</span></dt>
        <dt class="optional">port <span class="property-type">number</span></dt>
        <dt class="optional">windowMs <span class="property-type">number</span></dt>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>Array of <code>{ address, port, cid, raw }</code> entries for each device that responded inside the listen window. <code>cid</code> is the device identifier as advertised in the scan reply.</dd>
    </dl>

    <h3>Notes</h3>
    <p>The discovery packet is sent unencrypted; the responses are not decrypted by this node, so only the envelope fields (IP, port, cid) are guaranteed to be useful. Use the IP and cid to configure a <code>gree-hvac-config</code> node.</p>
</script>
