services:
  gree-sim:
    build:
      context: ./sim
      dockerfile: Dockerfile
    image: gree-hvac-sim:dev
    container_name: gree-sim
    hostname: gree-sim
    environment:
      GREE_SIM_UDP_PORT: "7000"
      GREE_SIM_HTTP_PORT: "8080"
      GREE_SIM_CIPHER: "ecb"
      GREE_SIM_VERBOSE: "1"
      GREE_SIM_NAME: "Gree-Sim-AC"
    # Published on loopback only: the sim dashboard and the Node-RED editor
    # have no authentication. Set GREE_BIND=0.0.0.0 to reach them from other
    # machines on a trusted network.
    ports:
      - "${GREE_BIND:-127.0.0.1}:7000:7000/udp"
      - "${GREE_BIND:-127.0.0.1}:8080:8080/tcp"
    networks:
      sim-net:
        # The dev flow's gree-hvac-config points at host "gree.lan"; this
        # alias makes the sim container resolvable under that name.
        aliases:
          - gree.lan
    restart: unless-stopped
    # The sim only reads its own files and binds ports > 1024.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  node-red:
    build:
      context: .
      dockerfile: docker/nodered/Dockerfile
    image: gree-hvac-nodered:dev
    container_name: gree-nodered
    depends_on:
      gree-sim:
        condition: service_healthy
    ports:
      - "${GREE_BIND:-127.0.0.1}:1880:1880"
    networks:
      - sim-net
    restart: unless-stopped
    # Runs as the unprivileged node-red user on port 1880; /data stays
    # writable (flows, context store), so no read_only here.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  sim-net:
    driver: bridge
